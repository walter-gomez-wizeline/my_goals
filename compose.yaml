name: my-goals-local
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: my_goals_local
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: my_goals_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - development_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_goals_local -d my_goals_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
  test-db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: my_goals_local
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: my_goals_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my_goals_local -d my_goals_test"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  development_data:
